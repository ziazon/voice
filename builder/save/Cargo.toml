[package]
name = "persona-builder-save"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
persona-builder = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# All three already resolve through ureq and rustls at these versions; declared so the code can use them.
base64 = "=0.23.1"
libc = "=0.2.191"
zeroize = "=1.9.1"
