[package]
name = "voice-api"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
radio-panels = { git = "https://github.com/awna-ai/radio", tag = "v0.1.0" }
voice-grow = { path = "../grow" }
voice-build = { path = "../build" }
voice-steps = { path = "../steps" }
voice-core = { path = "../core" }
voice-ingest = { path = "../ingest" }
voice-agent = { path = "../agent" }
voice-save = { path = "../save" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
voice-panel-runner = { path = "../panel-runner" }

[dev-dependencies]
libc = "=0.2.191"
voice-agent = { path = "../agent", features = ["test-stubs"] }

[features]
claude-subscription = ["voice-agent/claude-subscription"]
