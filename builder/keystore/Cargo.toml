[package]
name = "persona-builder-keystore"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "=1.0.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust (no tokio, no OpenSSL), so the Linux build needs no C toolchain.
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }
