[package]
name = "persona-builder-build"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
persona-builder = { path = "../core" }
persona-builder-ingest = { path = "../ingest" }
persona-builder-steps = { path = "../steps" }
