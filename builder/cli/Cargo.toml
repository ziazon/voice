[package]
name = "persona-builder-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "persona-builder"
path = "src/main.rs"

[dependencies]
persona-builder-api = { path = "../api" }
clap = { version = "4.6", features = ["derive", "string"] }
persona-builder = { path = "../core" }
persona-builder-save = { path = "../save" }
persona-builder-ingest = { path = "../ingest" }
persona-builder-agent = { path = "../agent" }
persona-builder-steps = { path = "../steps" }
persona-builder-build = { path = "../build" }
persona-builder-grow = { path = "../grow" }
serde_json = { version = "1", features = ["preserve_order"] }
