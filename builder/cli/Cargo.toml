[package]
name = "voice-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "voice"
path = "src/main.rs"

[dependencies]
voice-api = { path = "../api" }
clap = { version = "4.6", features = ["derive", "string"] }
voice-core = { path = "../core" }
voice-save = { path = "../save" }
voice-ingest = { path = "../ingest" }
voice-agent = { path = "../agent" }
voice-steps = { path = "../steps" }
voice-build = { path = "../build" }
voice-grow = { path = "../grow" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
