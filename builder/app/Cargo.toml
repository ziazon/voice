[package]
name = "voice-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
tauri = { version = "=2.12.0", features = [] }
voice-api = { path = "../api" }

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[features]
claude-subscription = ["voice-api/claude-subscription"]
