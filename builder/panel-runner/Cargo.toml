[package]
name = "voice-panel-runner"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
radio-panels = { git = "https://github.com/awna-ai/radio", tag = "v0.1.0" }
voice-core = { path = "../core" }
voice-ingest = { path = "../ingest" }
voice-agent = { path = "../agent" }
voice-build = { path = "../build" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "=1.13.1"
libc = "=0.2.191"

[dev-dependencies]
voice-agent = { path = "../agent", features = ["test-stubs"] }
